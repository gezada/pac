# Virtual host exclusivo do PAC.
# Destino previsto na VPS: /etc/nginx/sites-available/pac.bet
# Não substitui nginx.conf nem qualquer configuração preexistente.

server {
    listen 80;
    listen [::]:80;

    server_name pac.bet www.pac.bet;

    root /srv/pac/web/current;
    index index.html;

    access_log /var/log/nginx/pac.bet.access.log;
    error_log  /var/log/nginx/pac.bet.error.log;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
